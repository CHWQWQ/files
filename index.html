<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常見問題 FAQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary .chev { transform: rotate(90deg); }
        .chev { transition: transform .2s ease; }
        .q-hit { background: #fef9c3; }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">常見問題 FAQ</h1>
                    <p id="deptLine" class="text-sm text-gray-500 mt-1"></p>
                </div>
                <div class="flex items-center gap-2">
                    <label for="deptSelect" class="text-sm text-gray-600">單位</label>
                    <select id="deptSelect" class="input-modern text-sm py-2 px-3"></select>
                </div>
            </div>
            <input id="searchBox" type="search" placeholder="搜尋問題或答案…" class="input-modern w-full mt-4" aria-label="搜尋問題或答案" disabled>
            <nav id="catNav" class="flex flex-wrap gap-2 mt-4" aria-label="類別"></nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div id="status" class="hidden"></div>
        <div id="content" class="space-y-6"></div>
        <p id="noResult" class="hidden text-center text-gray-500 py-10">找不到符合的問題</p>
    </main>

    <script>
    const DEPARTMENTS = {
        shsd: '住宿服務組', isrc: '原民中心', dsa: '學務長室', saad: '就學服務組', clss: '生輔教中心',
        hd: '衛生保健組', esd: '課外活動組', scd: '諮商輔導組', hesp: '高教深耕'
    };
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let dept = params.get('dept') in DEPARTMENTS ? params.get('dept') : 'shsd';
    // 資料來源：?src=檔名.json 優先；否則讀同資料夾的 faq_{單位代碼}.json
    const src = params.get('src') || `faq_${dept}.json`;

    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 答案只允許編輯器產生的 <a> 超連結（且只限 http/https），其餘 HTML 一律當純文字顯示
    function renderAnswer(raw) {
        return escapeHtml(raw).replace(
            /&lt;a href=&quot;(https?:\/\/(?:[^&\s]|&amp;)+)&quot;(?:(?!&gt;).)*?&gt;(.*?)&lt;\/a&gt;/g,
            (m, href, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 underline">${text}</a>`
        );
    }

    function showStatus(html, kind) {
        const box = $('status');
        box.className = `rounded-xl p-5 mb-6 text-sm leading-relaxed ${kind === 'error' ? 'bg-amber-50 border border-amber-200 text-amber-900' : 'bg-blue-50 text-blue-900'}`;
        box.innerHTML = html;
    }

    function render(data) {
        const deptCode = (data[0] && data[0].id.match(/^([a-z]+)_/) || [])[1];
        if (deptCode in DEPARTMENTS) { dept = deptCode; $('deptSelect').value = dept; }
        $('deptLine').textContent = DEPARTMENTS[dept] || '';
        document.title = `${DEPARTMENTS[dept] || ''} 常見問題 FAQ`;

        $('catNav').innerHTML = data.map(c =>
            `<a href="#cat-${escapeHtml(c.id)}" class="px-3 py-1.5 rounded-full text-sm bg-white border border-gray-200 text-gray-700 hover:border-blue-500 hover:text-blue-600">${escapeHtml(c.categoryName)}</a>`
        ).join('');

        $('content').innerHTML = data.map(cat => {
            let lastSub = null;
            const items = cat.questions.map(q => {
                let head = '';
                if (q.subCategory && q.subCategory !== lastSub) {
                    head = `<h3 class="sub-head pt-4 pb-1 text-sm font-semibold text-blue-700 border-b border-blue-100">${escapeHtml(q.subCategory)}</h3>`;
                }
                lastSub = q.subCategory || null;
                // 沒有答案的「問題」其實是小標題，用標籤顯示而不是可展開的問答
                if (!q.answer.trim()) {
                    return head + `<p class="label pt-3 font-medium text-gray-600" data-text="${escapeHtml(q.question)}">${escapeHtml(q.question)}</p>`;
                }
                return head + `
                <details id="${escapeHtml(q.id)}" class="q rounded-lg border border-gray-200 bg-white">
                    <summary class="flex items-start gap-3 p-4">
                        <svg class="chev w-4 h-4 mt-1 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9,18 15,12 9,6"></polyline></svg>
                        <span class="font-medium text-gray-800">${escapeHtml(q.question)}</span>
                    </summary>
                    <div class="ans px-4 pb-4 pl-11 text-gray-700 leading-relaxed whitespace-pre-line">${renderAnswer(q.answer)}</div>
                </details>`;
            }).join('');
            return `<section id="cat-${escapeHtml(cat.id)}" class="cat card-modern p-5 md:p-6 scroll-mt-4">
                <h2 class="text-xl font-bold text-gray-800 mb-3">${escapeHtml(cat.categoryName)}</h2>
                <div class="space-y-2">${items}</div></section>`;
        }).join('');

        $('searchBox').disabled = false;
        $('status').className = 'hidden';
        const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target && target.tagName === 'DETAILS') { target.open = true; target.scrollIntoView(); }
    }

    function validate(data) {
        return Array.isArray(data) && data.every(c => c && typeof c.id === 'string' && typeof c.categoryName === 'string'
            && Array.isArray(c.questions) && c.questions.every(q => q && typeof q.id === 'string'
                && typeof q.question === 'string' && typeof q.answer === 'string'));
    }

    function load(data) {
        if (!validate(data)) { showStatus('這個檔案不是正確的 FAQ JSON 格式（請使用 FAQ 編輯器匯出的檔案）。', 'error'); return; }
        if (data.length === 0) { showStatus('這份 FAQ 目前沒有內容。', 'error'); return; }
        render(data);
    }

    // 搜尋：比對問題與答案文字，隱藏不符合的問題與沒有結果的類別
    $('searchBox').addEventListener('input', (e) => {
        const kw = e.target.value.trim().toLowerCase();
        let hits = 0;
        document.querySelectorAll('#content .cat').forEach(cat => {
            let catHits = 0;
            cat.querySelectorAll('.q').forEach(d => {
                const match = !kw || d.textContent.toLowerCase().includes(kw);
                d.classList.toggle('hidden', !match);
                if (kw && match) d.open = true; else if (!kw) d.open = false;
                if (match) catHits++;
            });
            // 搜尋時隱藏小標題與標籤（它們可能已經沒有底下的問題）
            cat.querySelectorAll('.sub-head, .label').forEach(el => el.classList.toggle('hidden', !!kw));
            cat.classList.toggle('hidden', !!kw && catHits === 0);
            hits += catHits;
        });
        $('noResult').classList.toggle('hidden', !kw || hits > 0);
    });

    // 單位選單：切換後重新載入該單位的 JSON
    $('deptSelect').innerHTML = Object.entries(DEPARTMENTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    $('deptSelect').value = dept;
    $('deptSelect').addEventListener('change', (e) => { location.search = `?dept=${e.target.value}`; });

    // 讀取資料；直接雙擊開啟（file://）時瀏覽器會擋 fetch，改提供選檔方式
    const pickerHtml = `<label class="inline-block mt-3 px-4 py-2 bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700">選擇 JSON 檔案<input id="filePick" type="file" accept=".json" class="hidden"></label>`;
    function bindPicker() {
        const pick = $('filePick');
        if (pick) pick.addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (!f) return;
            f.text().then(t => { try { load(JSON.parse(t)); } catch (err) { showStatus('無法讀取：不是有效的 JSON 檔案。', 'error'); } });
        });
    }
    fetch(src)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(load)
        .catch(() => {
            showStatus(`讀不到資料檔 <code class="bg-white px-1 rounded">${escapeHtml(src)}</code>。<br>
                請確認檔案放在這個頁面的同一個資料夾，且網頁是透過伺服器開啟（直接雙擊檔案開啟時瀏覽器不允許讀檔）。<br>
                你也可以直接選擇檔案預覽：${pickerHtml}`, 'error');
            bindPicker();
        });
    </script>
</body>
</html>
